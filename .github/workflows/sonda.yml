name: Sonda pagina

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Indirizzo da analizzare"
        required: true
      maxlink:
        description: "Quanti link mostrare"
        default: "60"

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - env:
          URL: ${{ inputs.url }}
          MAXLINK: ${{ inputs.maxlink }}
        run: python scraper/sonda.py
