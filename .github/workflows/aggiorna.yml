name: Aggiorna avvisi

on:
  schedule:
    - cron: "17 5 * * *"    # ogni giorno alle 6:17 ora italiana (inverno)
    - cron: "37 12 * * *"   # secondo giro alle 13:37, se GitHub ritarda o salta il primo
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write
  actions: read

concurrency:
  group: aggiorna-avvisi
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Evita i doppioni (giro programmato di GitHub arrivato in ritardo)
        id: guardia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/aggiorna.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion != \"cancelled\") | select((now - (.created_at|fromdateiso8601)) < 5*3600)] | length")
            if [ "$n" -gt 0 ]; then echo "Gia' fatto un giro nelle ultime 5 ore: salto."; echo "salta=1" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/checkout@v4
        if: steps.guardia.outputs.salta != '1'

      - uses: actions/setup-python@v5
        if: steps.guardia.outputs.salta != '1'
        with:
          python-version: "3.12"

      - name: Installa librerie
        if: steps.guardia.outputs.salta != '1'
        run: pip install requests beautifulsoup4

      - name: Scansiona le scuole
        if: steps.guardia.outputs.salta != '1'
        env:
          REGIONE: ${{ vars.REGIONE || 'TUTTE' }}
          MAX_ISTITUTI: ${{ vars.MAX_ISTITUTI || '0' }}
          THREADS: "12"
          SITO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scraper/scan.py

      - name: Salva i risultati
        if: steps.guardia.outputs.salta != '1'
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main && python scraper/unisci_remoto.py
          git add -A data avvisi sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Aggiornamento avvisi $(date +%F)"
          git pull --rebase -X theirs origin main
          git push
