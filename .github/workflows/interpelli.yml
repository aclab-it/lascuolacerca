name: Interpelli rapidi

on:
  schedule:
    - cron: "47 6-18/3 * * 1-6"   # circa ogni 3 ore, 7:47-19:47 ora italiana, lun-sab
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: interpelli-rapidi        # coda propria: non viene scartato mentre gira il giro completo
  cancel-in-progress: false

jobs:
  interpelli:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Evita i doppioni (giro programmato di GitHub arrivato in ritardo)
        id: guardia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/interpelli.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion != \"cancelled\") | select((now - (.created_at|fromdateiso8601)) < 2*3600)] | length")
            if [ "$n" -gt 0 ]; then echo "Gia' fatto un giro nelle ultime 2 ore: salto."; echo "salta=1" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/checkout@v4
        if: steps.guardia.outputs.salta != '1'

      - uses: actions/setup-python@v5
        if: steps.guardia.outputs.salta != '1'
        with:
          python-version: "3.12"

      - name: Installa librerie
        if: steps.guardia.outputs.salta != '1'
        run: pip install requests beautifulsoup4

      - name: Rilegge gli albi noti
        if: steps.guardia.outputs.salta != '1'
        env:
          MODO: interpelli
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THREADS: "16"
          SITO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/scan.py

      - name: Salva i risultati
        if: steps.guardia.outputs.salta != '1'
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main && python scraper/unisci_remoto.py
          git add -A data
          git diff --cached --quiet || git commit -m "Interpelli $(date +%F\ %H:%M)"
          git pull --rebase -X theirs origin main
          git push
