<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Apertura interpello – La Scuola Cerca</title>
<link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"><meta name="theme-color" content="#0f5c4d">
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f5f1;color:#1d1d1f;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box;text-align:center}
  button{margin-top:14px;padding:12px 20px;border:0;border-radius:10px;background:#24456b;color:#fff;font-size:1rem;cursor:pointer}
  a{color:#24456b}
</style>
</head>
<body>
<div>
  <p id="msg">Apertura dell'interpello sul sito dell'Ufficio scolastico regionale del Piemonte…</p>
  <!-- il sito dell'USR mostra l'interpello solo dopo il pulsante "Stampa" (modulo POST): lo ripetiamo noi -->
  <form id="f" method="POST">
    <input type="hidden" name="progr" id="progr">
    <input type="hidden" name="Submit" value="Stampa">
    <button type="submit">Apri l'interpello</button>
  </form>
  <p><a href="interpelli.html">← Torna agli interpelli</a></p>
</div>
<script>
const q = new URLSearchParams(location.search);
const anno = q.get("a") || "", progr = q.get("p") || "";
if (/^\d{4}$/.test(anno) && /^\d{1,7}$/.test(progr)) {
  const f = document.getElementById("f");
  f.action = `https://servizi.istruzionepiemonte.it/interpello${anno}/statointerpello_ambito.php`;
  document.getElementById("progr").value = progr;
  f.submit();
} else {
  document.getElementById("msg").textContent = "Collegamento non valido.";
  document.getElementById("f").hidden = true;
}
</script>
</body>
</html>
